name: Build NHSpectrum APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install Android SDK Platform 36
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Unit tests, Android lint and Debug APK
      run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: NHSpectrum-Lint-Report
        path: app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
        if-no-files-found: ignore
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NHSpectrum-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
