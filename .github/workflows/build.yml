name: Build NHSpectrum APK

on:
  push:

permissions:
  contents: read

concurrency:
  group: nhspectrum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Install Android SDK Platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit tests, Android lint and complete APK
        env:
          ORG_GRADLE_PROJECT_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "Complete NHSpectrum APK built: $APK_SIZE bytes"
          test "$APK_SIZE" -gt 1000000
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NHSpectrum-Lint-Report
          path: app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NHSpectrum-Full-APK
          path: app/build/outputs/apk/debug/app-debug.apk
